<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e1d0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cơ Tiên" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Cơ Tiên — bida tu tiên: 13 môn phái, 65 tướng, vật lý và luật bida thật. 8 bi, 9 bi, 10 bi, phăng. Chơi offline trên điện thoại." />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>Cơ Tiên</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e9e1d0; }
      .rotate-hint { display: none; }
      #boot { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #e9e1d0; color: #1a1713; font: 600 16px/1.4 Georgia, serif; }
      #boot img { width: min(70vw, 420px); height: auto; }
      #boot .boot-seal { width: 14px; height: 14px; border-radius: 3px; background: #b03522; animation: boot-pulse 1s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(0.6) rotate(45deg); opacity: 0.6; } }
      @media (prefers-reduced-motion: reduce) { #boot .boot-seal { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status"><img src="./art/ui/logo.webp" alt="Cơ Tiên" /><span class="boot-seal"></span><span>Đang tải…</span></div>
    <div id="stage"></div>
    <div id="ui"></div>
    <div class="rotate-hint" role="alert">
      <div class="rh-card">
        <div class="rh-stage" aria-hidden="true"><img class="rh-phone" src="./art/ui/phone.webp" alt="" /><img class="rh-arrow" src="./art/ui/rotate-arrow.webp" alt="" /></div>
        <div class="rh-copy">
          <div class="rh-title">Xoay ngang để chơi</div>
          <div class="rh-sub">Cơ Tiên được vẽ cho màn hình ngang. Nếu máy không tự xoay, hãy tắt khoá xoay màn hình.</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
